<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081325" />
      <stop offset="50%" stop-color="#0d1f3d" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" />

  <!-- Outer Ring Accent -->
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.4" />

  <!-- Tilted Background Card (Spade) -->
  <g transform="translate(68, 42) rotate(-12)" filter="url(#shadow)">
    <rect width="64" height="96" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 32 30 C 26 38 18 48 18 58 C 18 66 24 72 30 72 C 32 72 34 71 36 69 L 36 78 L 28 82 L 36 82 L 44 82 L 36 78 L 36 69 C 38 71 40 72 42 72 C 48 72 54 66 54 58 C 54 48 46 38 40 30 Z" fill="#0f172a" transform="scale(0.8) translate(5, 5)" />
    <text x="8" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="14" fill="#0f172a">A</text>
  </g>

  <!-- Foreground Card (Heart / CareTech) -->
  <g transform="translate(74, 52) rotate(10)" filter="url(#shadow)">
    <rect width="64" height="96" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Heart Symbol -->
    <path d="M 32 40 C 32 32 20 26 14 34 C 8 42 12 56 32 72 C 52 56 56 42 50 34 C 44 26 32 32 32 40 Z" fill="#ef4444" transform="scale(0.85) translate(4, 5)" />
    <text x="8" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="14" fill="#ef4444">K</text>
  </g>

  <!-- CareTech Brand Accent Pill -->
  <rect x="36" y="148" width="120" height="24" rx="12" fill="#2563eb" fill-opacity="0.9" filter="url(#shadow)" />
  <text x="96" y="164" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">SOLITARIO CARE</text>
</svg>
