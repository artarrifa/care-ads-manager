<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081325" />
      <stop offset="50%" stop-color="#0d1f3d" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="cardGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="glowBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg512)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#glowBrand)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Background Card 1 (Spades A) -->
  <g transform="translate(180, 110) rotate(-14)" filter="url(#shadow512)">
    <rect width="170" height="255" rx="20" fill="url(#cardGrad512)" stroke="#cbd5e1" stroke-width="3" />
    <path d="M 85 80 C 70 100 50 125 50 150 C 50 170 65 185 80 185 C 85 185 90 183 95 178 L 95 200 L 75 210 L 95 210 L 115 210 L 95 200 L 95 178 C 100 183 105 185 110 185 C 125 185 140 170 140 150 C 140 125 120 100 105 80 Z" fill="#0f172a" transform="scale(0.85) translate(10, 10)" />
    <text x="22" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="38" fill="#0f172a">A</text>
  </g>

  <!-- Foreground Card 2 (Heart K) -->
  <g transform="translate(195, 135) rotate(10)" filter="url(#shadow512)">
    <rect width="170" height="255" rx="20" fill="url(#cardGrad512)" stroke="#cbd5e1" stroke-width="3" />
    <!-- Heart Symbol -->
    <path d="M 85 105 C 85 85 55 70 40 90 C 25 110 35 145 85 185 C 135 145 145 110 130 90 C 115 70 85 85 85 105 Z" fill="#ef4444" transform="scale(0.9) translate(5, 10)" />
    <text x="22" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="38" fill="#ef4444">K</text>
  </g>

  <!-- CareTech Brand Ribbon / Pill -->
  <rect x="96" y="405" width="320" height="60" rx="30" fill="#0d1f3d" stroke="#3b82f6" stroke-width="2" filter="url(#shadow512)" />
  <text x="256" y="443" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">SOLITARIO CARE</text>
</svg>
