<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión | Solitario Care</title>
  <style>
    body {
      background-color: #081325;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #0d1f3d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
      color: #60a5fa;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🃏📶</div>
    <h1>Sin Conexión a Internet</h1>
    <p>
      Para jugar a Solitario Care en modo offline por primera vez, necesitas haber cargado el juego una vez con conexión. Si ya lo hiciste, intenta recargar la página.
    </p>
    <button class="btn" onclick="window.location.reload()">Reintentar Carga</button>
  </div>
</body>
</html>
